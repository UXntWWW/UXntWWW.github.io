<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="site.title.install">Установка — UXNTWWW.io</title>
<script src="theme.js"></script>
<script src="lang.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" href="GlobalIconFav.png">
<style>
  :root {
    --bg: #ffffff; --text: #000000;
    --bar: #008000; --bar-text: #ffffff;
    --card: #f2f2f2;
    --nav-fill: #ffffff; --nav-text: #000000; --nav-border: #000000;
    --input-bg: #1a1d24; --input-text: #ffffff; --input-border: #3a3d44;
  }
  body {
    margin: 0; font-family: sans-serif;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
  }
  .top-bar {
    background: var(--bar); color: var(--bar-text);
    padding: 20px 15px; position: relative;
    transition: background-color .25s, color .25s;
  }
  .top-bar h1 { margin: 0; font-size: 1.4rem; }
  .content { padding: 24px; max-width: 820px; margin: 0 auto; }
  h2 { margin-top: 30px; }

  .install-step {
    display: flex; gap: 18px;
    padding: 20px; border-radius: 14px;
    background: var(--card);
    margin-bottom: 16px;
    border: 2px solid var(--card);
    align-items: flex-start;
  }
  body.glass-mode .install-step {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
  }
  .install-step-num {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bar);
    color: var(--bar-text);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 1.2rem;
  }
  .install-step-body { flex: 1; }
  .install-step-title {
    font-weight: bold; font-size: 1.05rem; margin: 0 0 6px;
  }
  .install-step-desc {
    margin: 0; opacity: 0.85; font-size: 0.95rem; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1 data-i18n="site.header">UXNTWWW.io - Сайт с файлами</h1>
  <nav class="top-nav"></nav>
</div>

<div class="content fade-in">

  <h2 data-i18n="install.howTo">Как установить</h2>

  <div class="install-step scroll-animate">
    <div class="install-step-num">1</div>
    <div class="install-step-body">
      <p class="install-step-title" data-i18n="install.step1">Скачайте файл</p>
      <p class="install-step-desc" data-i18n="install.step1.desc">Нажмите «Скачать.zip» на странице программы.</p>
    </div>
  </div>

  <div class="install-step scroll-animate">
    <div class="install-step-num">2</div>
    <div class="install-step-body">
      <p class="install-step-title" data-i18n="install.step2">Распакуйте</p>
      <p class="install-step-desc" data-i18n="install.step2.desc">Правый клик → «Извлечь всё» в любую папку.</p>
    </div>
  </div>

  <div class="install-step scroll-animate">
    <div class="install-step-num">3</div>
    <div class="install-step-body">
      <p class="install-step-title" data-i18n="install.step3">Запустите</p>
      <p class="install-step-desc" data-i18n="install.step3.desc">Откройте .exe файл. Windows может показать предупреждение — нажмите «Подробнее» → «Выполнить в любом случае».</p>
    </div>
  </div>

</div>

<script src="breadcrumbs.js"></script>
<script src="share.js"></script>
<script src="menu.js"></script>
<script src="scroll-animate.js"></script>
<script src="back-to-top.js"></script>
</body>
</html>
