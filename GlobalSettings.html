<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — UXNTWWW.io</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" href="GlobalIconFav.png">
<style>
  :root {
    --bg: #ffffff; --text: #000000;
    --bar: #008000; --bar-text: #ffffff;
    --card: #f2f2f2;
    --nav-fill: #ffffff; --nav-text: #000000; --nav-border: #000000;
    --input-bg: #1a1d24; --input-text: #ffffff; --input-border: #3a3d44;
  }
  body {
    margin: 0; font-family: sans-serif;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
  }
  .top-bar {
    background: var(--bar); color: var(--bar-text);
    padding: 20px 15px; position: relative;
    transition: background-color .25s, color .25s;
  }
  .top-bar h1 { margin: 0; font-size: 1.4rem; }

  .content { padding: 20px; max-width: 820px; margin: 0 auto; }

  .slider { position: relative; overflow: hidden; min-height: 900px; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%;
    transition: transform .35s ease, opacity .35s ease;
  }
  .slide.hidden-right { transform: translateX(110%); opacity: 0; pointer-events: none; }
  .slide.hidden-left  { transform: translateX(-110%); opacity: 0; pointer-events: none; }
  .slide.active       { transform: translateX(0); opacity: 1; pointer-events: auto; }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .theme-card {
    border-radius: 12px; padding: 14px; cursor: pointer;
    border: 3px solid transparent; background: var(--card);
    transition: transform .15s, border-color .15s, background .25s;
    user-select: none;
  }
  body.glass-mode .theme-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  .theme-card:hover { transform: translateY(-3px); }
  .theme-card.active { border-color: var(--btn-bg); }
  .theme-preview {
    height: 60px; border-radius: 8px; margin-bottom: 10px;
    overflow: hidden; border: 1px solid #00000022;
  }
  .theme-preview .bar { height: 40%; width: 100%; }
  .theme-preview .body { height: 60%; width: 100%; }
  .theme-name { font-weight: bold; font-size: 0.95rem; text-align: center; }

  .palette-title {
    margin: 20px 0 10px; font-size: 1rem; font-weight: bold;
    border-left: 4px solid var(--btn-bg); padding-left: 10px;
  }
