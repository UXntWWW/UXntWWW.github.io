<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная</title>
<script src="theme.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --bar: #008000;
    --bar-text: #ffffff;
    --btn-bg: #008000;
    --btn-text: #ffffff;
    --btn-hover: #006400;
    --card: #f2f2f2;
  }
  body {
    margin: 0; padding: 0;
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s, color .25s;
  }
  .top-bar {
    background-color: var(--bar);
    border: 4px solid var(--bar);
    color: var(--bar-text);
    padding-top: 20px;
    padding-bottom: 20px;
    padding-left: 15px;
    box-sizing: border-box;
    width: 100%;
    position: relative;
    transition: background-color .25s, border-color .25s;
  }
  .top-bar h1 { margin: 0; }
  .content { padding: 20px; position: relative; }

  #files-btn, #files-btn-v10 {
    position: absolute;
    left: 20px;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    display: inline-block;
    box-sizing: border-box;
    transition: background-color .2s;
  }
  #files-btn { top: 140px; }
  #files-btn-v10 { top: 290px; }
  #files-btn:hover, #files-btn-v10:hover { background-color: var(--btn-hover); }

  .status-text { position: absolute; left: 10px; top: 200px; margin: 0; }
  #update-text { position: absolute; left: 10px; top: 230px; margin: 0; }
  .status-text-v10 { position: absolute; left: 10px; top: 350px; margin: 0; }
  #update-text-v10 { position: absolute; left: 10px; top: 380px; margin: 0; }

  #settings-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background-color: white;
    color: black;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    border: 2px solid white;
    display: inline-block;
    box-sizing: border-box;
    transition: background-color .2s;
  }
  #settings-btn:hover { background-color: #e6e6e6; }
</style>
</head>
<body>
 <div class="top-bar">
   <h1>UXNTWWW.io - Сайт с файлами</h1>
   <a href="GlobalSettings.html" id="settings-btn">Настройки</a>
 </div>
 <div class="content">
   <p>Приветствую,ты попал(а) на сайт файлов и программ.</p>
   <p>Все файлы АБСОЛЮТНО проверены!</p>
   <p>Приятного использования!</p>

   <a href="files.html" id="files-btn">Файлы</a>
   <p class="status-text">PCCleaner(Проверено)</p>
   <p id="update-text">Обновлено:13.08.2026</p>

   <a href="files1.html" id="files-btn-v10">Файлы</a>
   <p class="status-text-v10">UXWEditor Free(Проверено)</p>
   <p id="update-text-v10">Обновлено:21.07.2026</p>
 </div>

<script src="theme.js"></script>
</body>
</html>
