<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="site.title.main">Главная — UXNTWWW.io</title>
<script src="analytics.js" async></script>
<script src="theme.js"></script>
<script src="lang.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" href="GlobalIconFav.png">
<style>
  :root {
    --bg: #ffffff; --text: #000000;
    --bar: #008000; --bar-text: #ffffff;
    --card: #f2f2f2;
    --nav-fill: #ffffff; --nav-text: #000000; --nav-border: #000000;
    --input-bg: #1a1d24; --input-text: #ffffff; --input-border: #3a3d44;
  }
  body {
    margin: 0; padding: 0;
    font-family: sans-serif;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
  }
  .top-bar {
    background-color: var(--bar);
    border: 4px solid var(--bar);
    color: var(--bar-text);
    padding: 20px 15px;
    box-sizing: border-box;
    width: 100%;
    position: relative;
    transition: background-color .25s, border-color .25s, color .25s;
  }
  .top-bar h1 { margin: 0; font-size: 1.4rem; }
  .content { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .intro { margin-bottom: 20px; }
  .intro p { margin: 6px 0; }

  .recent-section { margin-top: 40px; }
  .recent-title {
    font-size: 1.1rem; font-weight: bold;
    margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .recent-list { display: flex; gap: 12px; flex-wrap: wrap; }
  .recent-item {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 10px;
    background: var(--card); border: 2px solid var(--card);
    color: var(--text); text-decoration: none;
    font-weight: bold; font-size: 0.9rem;
    transition: opacity .2s;
  }
  body.glass-mode .recent-item {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  .recent-item:hover { opacity: 0.85; }
  .recent-item-icon { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; }

  /* Кнопка "Избранное" */
  .fav-filter-btn {
    padding: 12px 18px;
    border-radius: 12px;
    border: 2px solid var(--nav-border, #000);
    background: var(--nav-fill, #fff);
    color: var(--nav-text, #000);
    font-weight: bold;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background .25s, color .25s, border-color .25s, opacity .2s;
  }
  body.glass-mode .fav-filter-btn {
    background: var(--glass-bg);
    color: var(--text);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }
  .fav-filter-btn:hover { opacity: 0.85; }
  .fav-filter-btn.active {
    background: var(--bar);
    color: var(--bar-text);
    border-color: var(--bar);
  }

  /* Сообщение "нет избранных" */
  .no-favorites {
    padding: 40px 20px;
    text-align: center;
    opacity: 0.7;
    font-style: italic;
    display: none;
  }
</style>
</head>
<body>

 <div class="top-bar">
   <h1 data-i18n="site.header">UXNTWWW.io - Сайт с файлами</h1>
   <nav class="top-nav"></nav>
 </div>

 <div class="content fade-in">

   <div class="intro">
     <p data-i18n="index.intro1">Приветствую,ты попал(а) на сайт файлов и программ.</p>
     <p data-i18n="index.intro2">Все файлы АБСОЛЮТНО проверены!</p>
     <p data-i18n="index.intro3">Приятного использования!</p>
   </div>

   <div class="search-wrap">
     <input type="text" id="search-programs" class="search-input" data-i18n="index.search.placeholder" placeholder="Поиск программ...">
     <button type="button" class="fav-filter-btn" id="fav-filter-btn">★ <span data-i18n="index.favorites">Избранное</span></button>
     <button type="button" class="refresh-btn" id="refresh-btn" title="Обновить">↻</button>
   </div>

   <div class="program-cards" id="program-cards">

     <!-- ===== PCCleaner ===== -->
     <div class="program-card scroll-animate"
          data-name="PCCleaner"
          data-desc="Для чистки пк"
          data-desc-en="For PC cleaning"
          data-version="1.3"
          data-totaldata="12.4 MB, 13.08.2026"
          data-link="files.html"
          data-icon="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZsDBGFxtWw2pRVZh8HPGyT06yK4z6eKOfOkobWm_LsA&s=10"
          data-github-owner="UXntWWW"
          data-github-repo="UXntWWW.github.io">
     </div>

     <!-- ===== UXWEditor ===== -->
     <div class="program-card scroll-animate"
          data-name="UXWEditor"
          data-desc="Для редактирования текста"
          data-desc-en="For text editing"
          data-version="1.0"
          data-totaldata="8.5 MB, 21.07.2026"
          data-link="files1.html"
          data-icon="icon.png"
          data-github-owner="UXntWWW"
          data-github-repo="UXntWWW.github.io">
     </div>

     <!-- ===== wAppInstaller ===== -->
     <div class="program-card scroll-animate"
          data-name="wAppInstaller"
          data-desc="Для установки программ"
          data-desc-en="For installing programs"
          data-version="2.0"
          data-totaldata="250 KB, 29.09.2026"
          data-link="files2.html"
          data-icon="wapp.png"
          data-github-owner="UXntWWW"
          data-github-repo="UXntWWW.github.io">
     </div>

   </div>

   <div class="no-favorites" id="no-favorites">
     <span data-i18n="index.noFavorites">Нет избранных программ</span>
   </div>

   <div class="recent-section" id="recent-section" style="display:none;">
     <h3 class="recent-title">
       <span>🕒</span>
       <span data-i18n="index.recent.title">Недавно смотрели</span>
     </h3>
     <div class="recent-list" id="recent-list"></div>
   </div>

 </div>

<script>
(function () {
  'use strict';

  const versionFiles = ['version.txt', 'version1.txt', 'version2.txt'];
  const totalFiles   = ['totaldata.txt', 'totaldata1.txt', 'totaldata2.txt'];

  let favFilterActive = false;

  function fetchText(url) {
    return fetch(url, { cache: 'no-cache' })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => t.trim())
      .catch(() => null);
  }

  function parseTotal(str) {
    if (!str) return { size: '—', date: '—' };
    const parts = str.split(',').map(s => s.trim());
    return { size: parts[0] || '—', date: parts[1] || '—' };
  }

  function t(key, fallback) {
    if (window.Lang && window.Lang.t) {
      var v = window.Lang.t(key);
      if (v && v !== key) return v;
    }
    return fallback || key;
  }

  function buildCard(card, version, total) {
    const name = card.dataset.name;
    const lang = window.Lang ? window.Lang.get() : 'ru';
    const desc = (lang === 'en' && card.dataset.descEn) ? card.dataset.descEn : card.dataset.desc;
    const link = card.dataset.link;
    const icon = card.dataset.icon;
    const owner = card.dataset.githubOwner;
    const repo = card.dataset.githubRepo;
    const td = parseTotal(total || card.dataset.totaldata);

    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const isFav = favorites.indexOf(name) !== -1;

    card.innerHTML =
      '<button type="button" class="favorite-btn' + (isFav ? ' active' : '') + '" data-name="' + name + '">' + (isFav ? '★' : '☆') + '</button>' +
      '<img class="program-card-icon" src="' + icon + '" alt="' + name + '">' +
      '<h3 class="program-card-title">' + name +
        '<span class="program-card-version">v' + (version || '—') + '</span>' +
      '</h3>' +
      '<p class="program-card-desc">' + desc + '</p>' +
      '<div class="program-card-meta">' +
        '<div class="program-card-meta-row"><span>' + t('card.size', 'Размер') + ':</span><span>' + td.size + '</span></div>' +
        '<div class="program-card-meta-row"><span>' + t('card.updated', 'Обновлено') + ':</span><span>' + td.date + '</span></div>' +
        '<div class="program-card-meta-row"><span>' + t('card.safe', 'Безопасно') + ':</span>' +
          '<span class="program-card-safe"><span class="program-card-safe-icon">✓</span>' + t('card.safe.ok', 'Проверено') + '</span>' +
        '</div>' +
        '<div class="program-card-meta-row"><span>' + t('card.downloads', 'Скачиваний') + ':</span>' +
          '<span class="program-card-downloads" data-owner="' + owner + '" data-repo="' + repo + '">—</span>' +
        '</div>' +
      '</div>' +
      '<a href="' + link + '" class="program-card-btn">' + t('card.open', 'Открыть') + '</a>';

    const favBtn = card.querySelector('.favorite-btn');
    favBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
      const idx = favs.indexOf(name);
      if (idx === -1) favs.push(name);
      else favs.splice(idx, 1);
      localStorage.setItem('favorites', JSON.stringify(favs));
      favBtn.classList.toggle('active');
      favBtn.textContent = favBtn.classList.contains('active') ? '★' : '☆';

      // Если включён фильтр избранного — пересчитать
      if (favFilterActive) applyFilters();
    });

    card.querySelector('.program-card-btn').addEventListener('click', function () {
      let recent = JSON.parse(localStorage.getItem('recent') || '[]');
      recent = recent.filter(x => x.name !== name);
      recent.unshift({ name: name, link: link, icon: icon });
      recent = recent.slice(0, 3);
      localStorage.setItem('recent', JSON.stringify(recent));
    });
  }

  const cards = document.querySelectorAll('.program-card');

  function loadAll() {
    cards.forEach(function (card, i) {
      Promise.all([fetchText(versionFiles[i]), fetchText(totalFiles[i])]).then(function (res) {
        buildCard(card, res[0], res[1]);
        loadDownloadCounts();
      });
    });
  }

  let countsLoaded = false;
  function loadDownloadCounts() {
    if (countsLoaded) return;
    countsLoaded = true;

    document.querySelectorAll('.program-card-downloads').forEach(function (el) {
      const owner = el.dataset.owner;
      const repo = el.dataset.repo;
      if (!owner || !repo) return;

      fetch('https://api.github.com/repos/' + owner + '/' + repo + '/releases', { cache: 'no-cache' })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(function (releases) {
          let total = 0;
          releases.forEach(function (rel) {
            (rel.assets || []).forEach(function (asset) {
              total += asset.download_count || 0;
            });
          });
          el.textContent = total > 0 ? total.toLocaleString('ru-RU') : '—';
        })
        .catch(function () { el.textContent = '—'; });
    });
  }

  // ===== Фильтры: поиск + избранное =====
  function applyFilters() {
    const q = (document.getElementById('search-programs').value || '').trim().toLowerCase();
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    let visibleCount = 0;

    document.querySelectorAll('.program-card').forEach(function (card) {
      const name = (card.dataset.name || '').toLowerCase();
      const desc = (card.dataset.desc || '').toLowerCase();
      const cardName = card.dataset.name;

      const matchSearch = !q || name.includes(q) || desc.includes(q);
      const matchFav = !favFilterActive || favorites.indexOf(cardName) !== -1;

      const match = matchSearch && matchFav;
      card.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });

    // Сообщение "нет избранных"
    const noFav = document.getElementById('no-favorites');
    if (noFav) {
      noFav.style.display = (favFilterActive && visibleCount === 0) ? 'block' : 'none';
    }
  }

  // Поиск
  const searchInput = document.getElementById('search-programs');
  if (searchInput) {
    searchInput.addEventListener('input', applyFilters);
  }

  // Кнопка "Избранное"
  const favBtn = document.getElementById('fav-filter-btn');
  if (favBtn) {
    favBtn.addEventListener('click', function () {
      favFilterActive = !favFilterActive;
      favBtn.classList.toggle('active', favFilterActive);
      applyFilters();
    });
  }

  // Обновление
  const refreshBtn = document.getElementById('refresh-btn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function () {
      refreshBtn.classList.add('spinning');
      countsLoaded = false;
      loadAll();
      setTimeout(function () { refreshBtn.classList.remove('spinning'); }, 800);
    });
  }

  function loadRecent() {
    const recent = JSON.parse(localStorage.getItem('recent') || '[]');
    if (!recent.length) return;

    const section = document.getElementById('recent-section');
    const list = document.getElementById('recent-list');
    if (!section || !list) return;

    section.style.display = 'block';
    list.innerHTML = '';

    recent.forEach(function (item) {
      const a = document.createElement('a');
      a.href = item.link;
      a.className = 'recent-item';
      a.innerHTML = '<img src="' + item.icon + '" class="recent-item-icon" alt="">' + item.name;
      list.appendChild(a);
    });
  }

  document.addEventListener('langChanged', function () {
    countsLoaded = false;
    loadAll();
    if (window.Lang && window.Lang.apply) window.Lang.apply();
  });

  function init() {
    loadAll();
    loadRecent();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script src="breadcrumbs.js"></script>
<script src="share.js"></script>
<script src="menu.js"></script>
<script src="scroll-animate.js"></script>
<script src="back-to-top.js"></script>
</body>
</html>
