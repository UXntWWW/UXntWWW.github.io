<!DOCTYPE html>

<head>

<script src="theme.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" href="GlobalIconFav.png">
<style>
  :root {
    --bg: #ffffff; --text: #000000;
    --bar: #008000; --bar-text: #ffffff;
    --card: #f2f2f2;
    --nav-fill: #ffffff; --nav-text: #000000; --nav-border: #000000;
    --btn-bg: #008000; --btn-hover: #006400;
  }
  body {
    margin: 0; padding: 0;
    font-family: sans-serif;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
  }
  .top-bar {
    background-color: var(--bar);
    border: 4px solid var(--bar);
    color: var(--bar-text);
    padding: 20px 15px;
    box-sizing: border-box;
    width: 100%;
    position: relative;
    transition: background-color .25s, border-color .25s, color .25s;
  }
  .top-bar h1 { margin: 0; font-size: 1.4rem; }
  .content { padding: 20px; position: relative; min-height: 500px; }

  #files-btn, #files-btn-v10 {
    position: absolute;
    left: 20px;
    background-color: var(--nav-fill);
    color: var(--nav-text);
    border: 2px solid var(--nav-border);
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    display: inline-block;
    box-sizing: border-box;
    transition: opacity .2s;
  }
  #files-btn { top: 140px; }
  #files-btn-v10 { top: 290px; }
  #files-btn:hover, #files-btn-v10:hover { opacity: 0.85; }

  .status-text { position: absolute; left: 10px; top: 200px; margin: 0; }
  #update-text { position: absolute; left: 10px; top: 230px; margin: 0; }
  .status-text-v10 { position: absolute; left: 10px; top: 350px; margin: 0; }
  #update-text-v10 { position: absolute; left: 10px; top: 380px; margin: 0; }

  @media (max-width: 700px) {
    #files-btn, #files-btn-v10,
    .status-text, #update-text,
    .status-text-v10, #update-text-v10 {
      position: static;
      display: block;
      margin: 8px 0;
    }
    #files-btn, #files-btn-v10 { display: inline-block; margin-top: 12px; }
  }
</style>
</head>
